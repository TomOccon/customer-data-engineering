[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dataguard"
version = "0.1.0"
description = "Small guards for common data pipeline failure modes"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["dataguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
